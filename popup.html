<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Axiom Vim</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Vim's statusline: the mode block is the on/off switch for every shortcut, the ruler shows the version. -->
  <header class="statusline">
    <label class="mode" title="Turns every shortcut on or off">
      <input type="checkbox" id="enabled">
      <span class="mode-on">NORMAL</span><span class="mode-off">OFF</span>
    </label>
    <span class="name">Axiom Vim</span>
    <span class="ruler" id="version"></span>
  </header>

  <main>
    <section class="settings">
      <label class="setting">
        <span>Vim keys <small>Moving, open, clear, Holders scrolling, back and forward</small></span>
        <input type="checkbox" id="vimNav" class="switch">
      </label>
      <label class="setting">
        <span>Zoom out per press <small>Chart wheel notches, 1 to 20</small></span>
        <input type="number" id="zoomSteps" min="1" max="20" step="1">
      </label>
    </section>

    <!-- Filled from AXS_ACTIONS. Rows marked .vim are the ones the "Vim keys" switch turns off; they dim while it's off. -->
    <details class="fold help" id="help">
      <summary><span>Keys</span><span class="meta" id="keysMeta"></span></summary>
      <p class="hint">Click a key, then press the new one. Esc cancels.</p>
      <div id="keyTables"></div>
      <div class="fold-foot">
        <button id="resetKeys" class="quiet">Reset all keys</button>
        <span class="hint">Keys go by position, so any layout works.</span>
      </div>
    </details>

    <details class="fold" id="teachFold" open>
      <summary><span>Teach</span><span class="meta" id="teachMeta"></span></summary>
      <p class="hint">If a button or list isn't found, click Teach, then click it on the page.</p>
      <div class="teach" data-what="pulseHide" data-key="hideSelector" data-empty="auto-detect">
        <span class="name">Pulse hide button</span><span class="btns"><button class="r">Reset</button><button class="t">Teach</button></span><code></code>
      </div>
      <div class="teach" data-what="pairHide" data-key="pairHideSelector" data-empty="not taught (hide is off on trade pages)">
        <span class="name">Trade hide button</span><span class="btns"><button class="r">Reset</button><button class="t">Teach</button></span><code></code>
      </div>
      <div class="teach" data-what="blacklist" data-key="blacklistSelector" data-empty="auto-detect (&quot;Blacklist dev&quot; button)">
        <span class="name">Blacklist dev button</span><span class="btns"><button class="r">Reset</button><button class="t">Teach</button></span><code></code>
      </div>
      <div class="teach" data-what="tabBar" data-key="tabBarSelector" data-empty="auto-detect">
        <span class="name">Tab bar</span><span class="btns"><button class="r">Reset</button><button class="t">Teach</button></span><code></code>
      </div>
      <div class="teach" data-what="holders" data-key="holdersSelector" data-empty="auto-detect">
        <span class="name">Holders list</span><span class="btns"><button class="r">Reset</button><button class="t">Teach</button></span><code></code>
      </div>
      <div class="teach" data-what="twitter" data-key="twitterSelector" data-empty="auto-detect">
        <span class="name">X (Twitter) link</span><span class="btns"><button class="r">Reset</button><button class="t">Teach</button></span><code></code>
      </div>
      <div class="teach" data-what="website" data-key="websiteSelector" data-empty="auto-detect">
        <span class="name">Website link</span><span class="btns"><button class="r">Reset</button><button class="t">Teach</button></span><code></code>
      </div>
    </details>
  </main>

  <!-- Like Vim's message line: what just happened, or what to do next. -->
  <footer>
    <p id="status" class="status" hidden></p>
    <textarea id="debugText" readonly hidden></textarea>
    <button id="debug" class="quiet" title="Copies the page structure (no wallet data) so detection can be fixed">Copy debug info</button>
  </footer>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
